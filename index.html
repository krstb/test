<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* 1. Auf Mobilgeräten deaktiviert (Android nutzt den nativen Splash Screen) */
        #app-splash {
            display: none;
        }

        /* 2. Nur auf dem Desktop aktiv: weißer Hintergrund */
        @media (hover: hover) and (pointer: fine) {
            #app-splash {
                position: fixed;
                inset: 0;
                background-color: #ffffff; /* Weißer Hintergrund */
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 99999;
                opacity: 1;
                transition: opacity 0.3s ease-out;
            }

            #app-splash img {
                width: 140px;
                height: 140px;
                object-fit: contain;
                border-radius: 28px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Sehr feiner, dezenter Schatten auf Weiß */
            }
        }
    </style>
</head>
<body>

    <!-- Start-Overlay (am Desktop mit weißem Hintergrund) -->
    <div id="app-splash" aria-hidden="true">
        <img src="icon-192.png" alt="App Logo">
    </div>

    <main style="padding: 2rem; text-align: center;">
        <h1>test App</h1>
        <p>Die Anwendung ist geladen.</p>
    </main>

    <script>
        // Blendet das Desktop-Overlay nach dem Laden weich aus
        window.addEventListener('load', () => {
            const splash = document.getElementById('app-splash');
            if (splash && window.getComputedStyle(splash).display !== 'none') {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 300);
                }, 200);
            }
        });
    </script>

</body>
</html>
