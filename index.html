<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        /* Grundlegendes Layout */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 1. App-Inhalt startet unsichtbar für nahtlosen Übergang */
        #app-content {
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        #app-content.visible {
            opacity: 1;
        }

        /* 2. Start-Overlay (Splash) */
        #app-splash {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 1;
            /* Weicher Übergang mit 'ease-in-out' */
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; /* Klicks blockieren verhindern */
        }

        #app-splash img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 24px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        /* Effekt beim Wegblenden: Icon zoomt dezent heran */
        #app-splash.fade-out {
            opacity: 0;
        }

        #app-splash.fade-out img {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- Start-Overlay -->
    <div id="app-splash" aria-hidden="true">
        <img src="icon-192.png" alt="App Logo">
    </div>

    <!-- Dein App-Inhalt (in #app-content gewrappt) -->
    <div id="app-content">
        <main style="padding: 2rem; text-align: center;">
            <h1>test App</h1>
            <p>Die Anwendung ist jetzt geladen.</p>
        </main>
    </div>

    <script>
        // Dauer der Icon-Anzeige (z. B. 1200 ms = 1,2 Sekunden)
        const SPLASH_TIME = 1200;

        window.addEventListener('load', () => {
            const splash = document.getElementById('app-splash');
            const content = document.getElementById('app-content');

            setTimeout(() => {
                // 1. App-Inhalt sanft einblenden
                if (content) content.classList.add('visible');

                // 2. Start-Overlay zeitgleich sanft ausblenden
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => {
                        splash.remove(); // Nach Ende der Transition aus dem DOM entfernen
                    }, 600);
                }
            }, SPLASH_TIME);
        });
    </script>

</body>
</html>
