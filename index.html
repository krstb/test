<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Zentriertes Vollbild-Start-Overlay */
        #app-splash {
            position: fixed;
            inset: 0;
            background-color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 1;
            transition: opacity 0.4s ease-out;
        }

        /* Standardmäßig auf mobilen Geräten und Touchscreens nicht anzeigen */
#app-splash {
    display: none;
}

/* Nur auf Desktop-Geräten (Windows / macOS) anzeigen */
@media (hover: hover) and (pointer: fine) {
    #app-splash {
        position: fixed;
        inset: 0;
        background-color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.4s ease-out;
    }
}
    </style>
</head>
<body>

    <div id="app-splash" aria-hidden="true">
        <img src="icon-192.png" alt="App Logo">
    </div>

    <main style="padding: 2rem; text-align: center;">
        <h1>test App</h1>
        <p>Die Anwendung ist geladen.</p>
    </main>

    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('app-splash');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    setTimeout(() => {
                        splash.remove();
                    }, 400);
                }, 250);
            }
        });
    </script>

</body>
</html>
