                        function updateAutoButtonUI() {
                const now = getNow();
                const isTargetToday = currentCalculationDate.toDateString() === now.toDateString();

                // Prüfen, ob heute vor der Öffnungszeit
                let isBeforeOpeningToday = false;
                if (isTargetToday && !currentTherme.permanentlyClosed) {
                    const dayName = days[now.getDay()];
                    const todayHours = currentTherme.openingHoursData[dayName];
                    if (todayHours) {
                        const [openH, openM] = todayHours.start.split(':').map(Number);
                        const openingTimeDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), openH, openM, 0, 0);
                        if (now.getTime() < openingTimeDate.getTime()) {
                            isBeforeOpeningToday = true;
                        }
                    }
                }

                if (!isEntryTimeAuto) {
                    autoTimeBtn.className = "flex items-center space-x-1 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase transition-colors bg-slate-200 text-slate-600 hover:bg-slate-300";
                    autoTimeDot.className = "w-1.5 h-1.5 rounded-full bg-slate-400";
                    autoTimeText.textContent = "Manuell";
                } else if (isTargetToday && !isBeforeOpeningToday) {
                    autoTimeBtn.className = "flex items-center space-x-1 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase transition-colors bg-emerald-100 text-emerald-700 hover:bg-emerald-200";

                    autoTimeText.textContent = "Öffnung";

            function getNow() {
                const now = new Date();
                now.setSeconds(0, 0); 
                return now;
            }

            function getNowTimeFormatted() {
                const now = getNow();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                return `${hours}:${minutes}`;
            }

            function formatDateShort(d) {
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `${day}.${month}.`;
            }

            function formatDurationText(min) {
                const h = Math.floor(min / 60);
                const m = Math.round(min % 60);
                if (m === 0) return `${String(h).padStart(2, '0')} Std.`;
                return `${String(h).padStart(1, '0')} Std. ${String(m).padStart(1, '0')} min`;
            }

            function getClosingTime(date, hours) {
                if (hours.end === '24:00') {
                    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 23, 59, 59);
                }
                const [endHour, endMinute] = hours.end.split(':').map(Number);
                const closingTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), endHour, endMinute);
                if (endHour === 24) {
                    closingTime.setDate(closingTime.getDate() + 1);
                    closingTime.setHours(0, 0, 0, 0);
                }
                return closingTime;
            }

            function findNextOpenDate(fromDate) {
                if (currentTherme.permanentlyClosed) {
                    return null; 
                }

                const checkDate = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
                for (let i = 0; i < 7; i++) {
                    const dayName = days[checkDate.getDay()];
                    const hours = currentTherme.openingHoursData[dayName];
                    if (hours) {
                        return { date: checkDate, hours: hours, dayName: dayName };
                    }
                    checkDate.setDate(checkDate.getDate() + 1);
                }
                return null;
            }

            function displayOpeningHours(date) {
                const dayName = days[date.getDay()];
                const hours = currentTherme.openingHoursData[dayName];
                const now = getNow();

                nextOpeningHoursDisplay.className = "text-center text-xs p-2 pr-8 rounded-xl font-medium w-full h-12 flex flex-col justify-center overflow-hidden transition-all shadow-sm";

                if (!hours || currentTherme.permanentlyClosed) {
                    const tomorrow = new Date(date);
                    tomorrow.setDate(date.getDate() + 1);
                    const nextOpen = currentTherme.permanentlyClosed ? null : findNextOpenDate(tomorrow);

                    nextOpeningHoursDisplay.classList.add("bg-amber-50", "text-amber-900", "border", "border-amber-200");
                    if (nextOpen && !currentTherme.permanentlyClosed) {
                        const dateStr = formatDateShort(nextOpen.date);
                        nextOpeningHoursDisplay.innerHTML = `<div><span class="inline-block px-1.5 py-0.5 mr-1 bg-rose-600 text-white rounded font-bold text-[10px] uppercase">Ruhetag</span> Nächste Öffnung:</div><div class="truncate"><strong>${nextOpen.dayName}, ${dateStr}</strong> ab <strong>${nextOpen.hours.start} Uhr</strong></div>`;
                    } else {
                        nextOpeningHoursDisplay.innerHTML = "Derzeit geschlossen";
                    }
                    return;
                }

                nextOpeningHoursDisplay.classList.add("bg-sky-50", "text-sky-900", "border", "border-sky-100");

                if (date.toDateString() === now.toDateString()) {
                    const closingTime = getClosingTime(date, hours);

                    if (now.getTime() < closingTime.getTime()) {
                        nextOpeningHoursDisplay.innerHTML = `<div>Geöffnet</div><div>${hours.start} - ${hours.end} Uhr</div>`;
                    } else {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(now.getDate() + 1);
                        const nextOpen = findNextOpenDate(tomorrow);
                        if (nextOpen) {
                            const dateStr = formatDateShort(nextOpen.date);
                            nextOpeningHoursDisplay.innerHTML = `<div>Geöffnet <strong>${nextOpen.dayName}, ${dateStr}</strong></div><div>${nextOpen.hours.start} - ${nextOpen.hours.end} Uhr</div>`;
                        } else {
                            nextOpeningHoursDisplay.innerHTML = "Geschlossen";
                        }
                    }
                } else {
                    const dateStr = formatDateShort(date);
                    nextOpeningHoursDisplay.innerHTML = `<div>Geöffnet <strong>${dayName}, ${dateStr}</strong></div><div>${hours.start} - ${hours.end} Uhr</div>`;
                }
            }

            function findBestOption(durationInMinutes) {
                let bestOption = null;
                let minCost = Infinity;
                let allCalculatedCosts = [];
                const hasExtension = currentTherme.extensionCost && currentTherme.extensionCost > 0;

                currentTherme.ticketPrices.forEach(ticket => {
                    let cost = ticket.price;
                    if (durationInMinutes > ticket.duration && ticket.duration !== Infinity) {
                        if (!hasExtension) {
                            cost = Infinity;
                        } else {
                            const extraMinutes = durationInMinutes - ticket.duration;
                            const extensionsNeeded = Math.ceil(extraMinutes / 30); 
                            cost += extensionsNeeded * currentTherme.extensionCost;
                        }
                    }

                    if (cost !== Infinity) {
                        allCalculatedCosts.push({ name: ticket.name, cost: cost, duration: ticket.duration });
                    }
                    
                    if (cost < minCost || (cost === minCost && ticket.duration > (bestOption ? bestOption.duration : 0))) {
                        minCost = cost;
                        bestOption = { name: ticket.name, duration: ticket.duration, price: ticket.price };
                    }
                });

                allCalculatedCosts.sort((a, b) => a.cost - b.cost);
                let savings = 0;
                let comparedToOption = '';
                
                const higherCostItem = allCalculatedCosts.find(item => item.cost > minCost);
                if (higherCostItem) {
                    savings = higherCostItem.cost - minCost;
                    comparedToOption = higherCostItem.name;
                }

                return { bestOption, calculatedCost: minCost, savings, comparedToOption };
            }

            function getBreakEvenTime(entryTime) {
                const baseTicket = currentTherme.ticketPrices.find(t => t.duration === 240) || currentTherme.ticketPrices.find(t => t.duration !== Infinity);
                const dayPassTicket = currentTherme.ticketPrices.find(t => t.duration === Infinity);
                
                breakEvenTimeContainer.classList.remove('invisible');
                breakEvenLabel.textContent = "Tageskarte ab";

                if (!dayPassTicket) {
                    return "N/A";
                }
                
                if (!baseTicket || baseTicket.price >= dayPassTicket.price) {
                    return "N/A";
                }

                let minutesToBreakEven;
                const hasExtension = currentTherme.extensionCost && currentTherme.extensionCost > 0;

                if (!hasExtension) {
                    minutesToBreakEven = baseTicket.duration + 1;
                } else {
                    const costDifference = dayPassTicket.price - baseTicket.price;
                    const maxExtensionsCheaper = Math.floor((costDifference - 0.01) / currentTherme.extensionCost);
                    minutesToBreakEven = baseTicket.duration + (maxExtensionsCheaper * 30) + 1;
                }

                const dayOfWeek = days[entryTime.getDay()];
                const hours = currentTherme.openingHoursData[dayOfWeek];
                if (!hours) return "Geschlossen";
                
                const openingTime = new Date(entryTime.getFullYear(), entryTime.getMonth(), entryTime.getDate(), ...hours.start.split(':').map(Number));
                const closingTime = getClosingTime(entryTime, hours);
                
                const exactEntry = new Date(entryTime.getTime());
                exactEntry.setSeconds(0, 0);
                const effectiveStartTime = new Date(Math.max(exactEntry.getTime(), openingTime.getTime()));
                
                const minutesAvailableToday = Math.round((closingTime.getTime() - effectiveStartTime.getTime()) / (1000 * 60));

                if (minutesToBreakEven > minutesAvailableToday) {
                    return "Heute nicht";
                }
                
                const breakEvenDate = new Date(effectiveStartTime.getTime() + minutesToBreakEven * 60 * 1000);
                return `${breakEvenDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
            }

            function getRecommendationColor(result) { 
                if (result.bestOption.name.includes('2-Stunden') && !result.bestOption.name.includes('ab 2')) {
                    return 'bg-gradient-to-br from-emerald-500 to-teal-600 shadow-emerald-500/20'; 
                }
                if (result.bestOption.name.includes('4-Stunden')) {
                    return 'bg-gradient-to-br from-amber-500 to-orange-500 shadow-amber-500/20'; 
                }
                return 'bg-gradient-to-br from-sky-500 to-blue-600 shadow-sky-500/20';
            }
            
            function handleInvalidInput(message) {
                clearTimeout(clearMessageTimer);
                recommendationBox.className = 'p-2 rounded-2xl text-white font-medium text-center bg-gradient-to-br from-rose-500 to-red-600 shadow-rose-500/20 shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden';
                targetDateBadge.classList.add('hidden');
                recommendationText.textContent = message;
                savingsText.innerHTML = '&nbsp;';
                calculatedCostDisplay.textContent = 'N/A';
                breakEvenTimeDisplay.textContent = 'N/A';
                tomorrowLabel.classList.add('hidden');
            }

            function updateDateBadge(targetDate, isRuhetagSkipped) {
                const now = getNow();
                if (targetDate.toDateString() !== now.toDateString() || isRuhetagSkipped) {
                    const dName = days[targetDate.getDay()];
                    const dStr = formatDateShort(targetDate);
                    targetDateBadge.textContent = `Berechnet für ${dName}, ${dStr}`;
                    targetDateBadge.classList.remove('hidden');
                } else {
                    targetDateBadge.classList.add('hidden');
                }
            }

            function calculateAndDisplay() {
                const now = getNow();
                
                const entryTimeValue = entryTimeInput.value;
                const departureTimeValue = departureTimeInput.value;
                const durationHoursValue = durationHoursInput.value;
                const durationMinutesValue = durationMinutesInput.value;

                let effectiveEntryTime = null;
                let effectiveDepartureTime = null;
                let durationInMinutes = 0;
                let adjustedMessage = '';
                
                if (!entryTimeValue) {
                    handleInvalidInput('Bitte Beginn eingeben.');
                    return;
                }

                if (!departureTimeValue && !durationHoursValue && !durationMinutesValue) {
                    if (lastInteractionType === 'duration') {
                        calculatedCostDisplay.textContent = 'N/A';
                        breakEvenTimeDisplay.textContent = 'N/A';
                        tomorrowLabel.classList.add('hidden');
                        return;
                    } else {
                        handleInvalidInput('Bitte Abreise oder Dauer eingeben');
                        return;
                    }
                }
                
                if (lastInteractionType === 'duration' && (durationHoursValue || durationMinutesValue)) {
                    const hours = parseInt(durationHoursValue) || 0;
                    const minutes = parseInt(durationMinutesValue) || 0;
                    let plannedDuration = hours * 60 + minutes;

                    if (plannedDuration <= 0) {
                        handleInvalidInput('Dauer muss größer 0 sein');
                        return;
                    }

                    let baseDate = new Date(now);
                    const todayHours = currentTherme.openingHoursData[days[baseDate.getDay()]];

                    if (!todayHours || now.getTime() >= getClosingTime(now, todayHours).getTime()) {
                        baseDate.setDate(baseDate.getDate() + 1);
                    } else if (entryTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        const testDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), entryHour, entryMinute, 0, 0);
                        const todayClosing = getClosingTime(now, todayHours);
                        
                        if (testDate.getTime() < now.getTime() || testDate.getTime() > todayClosing.getTime()) {
                            baseDate.setDate(baseDate.getDate() + 1);
                        }
                    }

                    const nextOpen = findNextOpenDate(baseDate);
                    if (!nextOpen) {
                        handleInvalidInput("Derzeit geschlossen");
                        return;
                    }

                    const dayForCalculation = nextOpen.date;
                    currentCalculationDate = dayForCalculation;
                    const openingHours = nextOpen.hours;
                    const isRuhetagSkipped = (dayForCalculation.toDateString() !== baseDate.toDateString());

                    updateDateBadge(dayForCalculation, isRuhetagSkipped);

                    const openingTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), ...openingHours.start.split(':').map(Number));
                    const closingTime = getClosingTime(dayForCalculation, openingHours);

                    let requestedEntryTime = new Date(dayForCalculation);
                    if (entryTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        requestedEntryTime.setHours(entryHour, entryMinute, 0, 0);

                        if (requestedEntryTime.getTime() < openingTime.getTime()) {
                            entryTimeInput.value = openingHours.start;
                            requestedEntryTime = new Date(openingTime);
                            adjustedMessage += 'Beginn auf Öffnungszeit angepasst<br>';
                        } else if (requestedEntryTime.getTime() > closingTime.getTime()) {
                            entryTimeInput.value = openingHours.end;
                            requestedEntryTime = new Date(closingTime);
                            adjustedMessage += 'Beginn auf Schließzeit angepasst<br>';
                        }
                    } else {
                        requestedEntryTime.setHours(openingTime.getHours(), openingTime.getMinutes(), 0, 0);
                    }

                    effectiveEntryTime = new Date(Math.max(requestedEntryTime.getTime(), openingTime.getTime()));

                    let startTimeShifted = isRuhetagSkipped;
                    const remainingMinutes = Math.max(0, (closingTime.getTime() - effectiveEntryTime.getTime()) / (1000 * 60));
                    const maxDurationExceeded = plannedDuration > remainingMinutes;

                    durationInMinutes = Math.min(plannedDuration, remainingMinutes);
                    effectiveDepartureTime = new Date(effectiveEntryTime.getTime() + durationInMinutes * 60 * 1000);
                    
                    if (maxDurationExceeded) {
                        durationHoursInput.value = String(Math.floor(remainingMinutes / 60)).padStart(2, '0');
                        durationMinutesInput.value = String(Math.round(remainingMinutes % 60)).padStart(2, '0');
                    }

                    if (effectiveDepartureTime.getTime() >= closingTime.getTime()) {
                        departureTimeInput.value = openingHours.end;
                    } else {
                        departureTimeInput.value = `${String(effectiveDepartureTime.getHours()).padStart(2, '0')}:${String(effectiveDepartureTime.getMinutes()).padStart(2, '0')}`;
                    }

                    const result = findBestOption(durationInMinutes);
                    recommendationText.textContent = result.bestOption.name;

                    let messages = [];
                    if (startTimeShifted) messages.push('Beginn auf Öffnungszeit angepasst');
                    if (maxDurationExceeded) messages.push(`Dauer angepasst<br>(max. ${formatDurationText(remainingMinutes)})`);

                    clearTimeout(clearMessageTimer);

                    if (messages.length > 0 || adjustedMessage) {
                        recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center bg-gradient-to-br from-rose-500 to-red-600 shadow-rose-500/20 shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden`;
                        savingsText.innerHTML = (adjustedMessage ? adjustedMessage : '') + messages.join('<br>');
                        
                        clearMessageTimer = setTimeout(() => {
                            let recommendationColor = getRecommendationColor(result);
                            recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center ${recommendationColor} shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden transition-colors duration-500`;
                            savingsText.innerHTML = result.savings > 0
                                ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                                : 'Dies ist die günstigste Option<br>&nbsp;';
                        }, 4000);
                    } else {
                        let recommendationColor = getRecommendationColor(result);
                        recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center ${recommendationColor} shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden`;
                        savingsText.innerHTML = result.savings > 0
                            ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                            : 'Dies ist die günstigste Option<br>&nbsp;';
                    }
                    
                    breakEvenTimeDisplay.textContent = getBreakEvenTime(effectiveEntryTime) || 'N/A';
                    calculatedCostDisplay.textContent = `${result.calculatedCost.toFixed(2).replace('.', ',')} €`;
                    displayOpeningHours(dayForCalculation);

                } else {
                    let targetDate = new Date(now);
                    const todayHours = currentTherme.openingHoursData[days[targetDate.getDay()]];

                    if (!todayHours || now.getTime() >= getClosingTime(now, todayHours).getTime()) {
                        targetDate.setDate(targetDate.getDate() + 1);
                    } else if (entryTimeValue && !departureTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        const testDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), entryHour, entryMinute, 0, 0);
                        const todayClosing = getClosingTime(now, todayHours);

                        if (testDate.getTime() < now.getTime() || testDate.getTime() > todayClosing.getTime()) {
                            targetDate.setDate(targetDate.getDate() + 1);
                        }
                    } else if (entryTimeValue && departureTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        const testDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), entryHour, entryMinute, 0, 0);
                        const todayClosing = getClosingTime(now, todayHours);
                        
                        if (testDate.getTime() < now.getTime() || testDate.getTime() > todayClosing.getTime()) {
                            targetDate.setDate(targetDate.getDate() + 1);
                        }
                    } else if (departureTimeValue) {
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);
                        const intendedDeparture = new Date(now.getFullYear(), now.getMonth(), now.getDate(), departureHour, departureMinute);
                        const todayClosingTime = getClosingTime(now, todayHours);

                        if (now.getTime() >= todayClosingTime.getTime() || (intendedDeparture.getTime() <= now.getTime() && intendedDeparture.getHours() < 6)) {
                            targetDate.setDate(targetDate.getDate() + 1);
                        }
                    }

                    const nextOpen = findNextOpenDate(targetDate);
                    if (!nextOpen) {
                        handleInvalidInput("N/A");
                        return;
                    }

                    const dayForCalculation = nextOpen.date;
                    currentCalculationDate = dayForCalculation;
                    const entryDayHours = nextOpen.hours;
                    const isRuhetagSkipped = (dayForCalculation.toDateString() !== targetDate.toDateString());

                    updateDateBadge(dayForCalculation, isRuhetagSkipped);

                    const openingTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), ...entryDayHours.start.split(':').map(Number));
                    const closingTime = getClosingTime(dayForCalculation, entryDayHours);

                    if (entryTimeValue && departureTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);

                        effectiveEntryTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), entryHour, entryMinute);
                        effectiveDepartureTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), departureHour, departureMinute);

                        if (effectiveDepartureTime.getTime() <= effectiveEntryTime.getTime()) {
                            effectiveDepartureTime.setDate(effectiveDepartureTime.getDate() + 1);
                        }
                    } else if (departureTimeValue) {
                        const [departureHour, departureMinute] = departureTimeValue.split(':').map(Number);

                        effectiveEntryTime = openingTime;

                        effectiveDepartureTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), departureHour, departureMinute);
                        if (effectiveDepartureTime.getTime() <= effectiveEntryTime.getTime()) {
                            effectiveDepartureTime.setDate(effectiveDepartureTime.getDate() + 1);
                        }
                    } else if (entryTimeValue) {
                        const [entryHour, entryMinute] = entryTimeValue.split(':').map(Number);
                        effectiveEntryTime = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), entryHour, entryMinute);
                        effectiveDepartureTime = new Date(effectiveEntryTime.getTime() + 3 * 60 * 60 * 1000);
                    }

                    if (entryTimeValue) {
                        const [entryH, entryM] = entryTimeInput.value.split(':').map(Number);
                        const inputTimeOnVisitDay = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), entryH, entryM);
                        
                        if (inputTimeOnVisitDay.getTime() < openingTime.getTime()) {
                            entryTimeInput.value = entryDayHours.start;
                            effectiveEntryTime = openingTime;
                            adjustedMessage += 'Beginn auf Öffnungszeit angepasst<br>';
                        } else if (inputTimeOnVisitDay.getTime() > closingTime.getTime()) {
                            entryTimeInput.value = entryDayHours.end;
                            effectiveEntryTime = closingTime;
                            adjustedMessage += 'Beginn auf Schließzeit angepasst<br>';
                        } else {
                            effectiveEntryTime = inputTimeOnVisitDay;
                        }
                    }
                    
                    if (departureTimeValue) {
                        const [depH, depM] = departureTimeInput.value.split(':').map(Number);
                        let depDate = new Date(dayForCalculation.getFullYear(), dayForCalculation.getMonth(), dayForCalculation.getDate(), depH, depM);
                        if (depDate.getTime() <= effectiveEntryTime.getTime()) {
                            depDate.setDate(depDate.getDate() + 1);
                        }

                        if (depDate.getTime() > closingTime.getTime()) {
                            departureTimeInput.value = entryDayHours.end;
                            effectiveDepartureTime = closingTime;
                            const maxMin = Math.max(0, (closingTime.getTime() - effectiveEntryTime.getTime()) / (1000 * 60));
                            adjustedMessage += `Abreise auf Schließzeit angepasst<br>(max. ${formatDurationText(maxMin)})<br>`;
                        } else if (depDate.getTime() < openingTime.getTime()) {
                            departureTimeInput.value = entryDayHours.start;
                            effectiveDepartureTime = openingTime;
                            adjustedMessage += 'Abreise auf Öffnungszeit angepasst<br>';
                        }
                    }
                    
                    durationInMinutes = Math.max(0, (effectiveDepartureTime.getTime() - effectiveEntryTime.getTime()) / (1000 * 60));
                    
                    if (departureTimeValue) {
                        const dH = Math.floor(durationInMinutes / 60);
                        const dM = Math.round(durationInMinutes % 60);
                        durationHoursInput.value = String(dH).padStart(2, '0');
                        durationMinutesInput.value = String(dM).padStart(2, '0');
                    }

                    const result = findBestOption(durationInMinutes);
                    const recommendationColor = getRecommendationColor(result);

                    recommendationText.textContent = result.bestOption.name;

                    clearTimeout(clearMessageTimer);

                    if (adjustedMessage) {
                        recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center bg-gradient-to-br from-rose-500 to-red-600 shadow-rose-500/20 shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden`;
                        savingsText.innerHTML = adjustedMessage.replace(/<br>$/, '');
                        
                        clearMessageTimer = setTimeout(() => {
                            recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center ${recommendationColor} shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden transition-colors duration-500`;
                            savingsText.innerHTML = result.savings > 0
                                ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                                : 'Dies ist die günstigste Option<br>&nbsp;';
                        }, 4000);
                    } else {
                        recommendationBox.className = `p-2 rounded-2xl text-white font-medium text-center ${recommendationColor} shadow-lg min-h-[106px] flex flex-col justify-center overflow-hidden`;
                        savingsText.innerHTML = result.savings > 0
                            ? `Du sparst ${result.savings.toFixed(2).replace('.', ',')} € im Vergleich zur<br>${result.comparedToOption}`
                            : 'Dies ist die günstigste Option<br>&nbsp;';
                    }

                    calculatedCostDisplay.textContent = `${result.calculatedCost.toFixed(2).replace('.', ',')} €`;
                    breakEvenTimeDisplay.textContent = getBreakEvenTime(effectiveEntryTime) || 'N/A';
                    displayOpeningHours(dayForCalculation);
                }

                if (effectiveEntryTime && effectiveDepartureTime) {
                    const entryDay = new Date(effectiveEntryTime);
                    entryDay.setHours(0, 0, 0, 0);
                    const departureDay = new Date(effectiveDepartureTime);
                    departureDay.setHours(0, 0, 0, 0);
                    
                    if (entryDay.getTime() !== departureDay.getTime()) { 
                        tomorrowLabel.classList.remove('hidden');
                    } else { 
                        tomorrowLabel.classList.add('hidden');
                    }
                } else { 
                    tomorrowLabel.classList.add('hidden');
                }

                updateAutoButtonUI();
            }
            
            function handleInput(event) {
                const targetId = event.target.id;

                if (targetId === 'entryTime') {
                    lastInteractionType = 'time';
                    isEntryTimeAuto = false;
                    updateAutoButtonUI();
                } else if (targetId === 'departureTime') {
                    lastInteractionType = 'time';
                    durationHoursInput.value = '';
                    durationMinutesInput.value = '';
                } else if (targetId === 'durationHours' || targetId === 'durationMinutes') {
                    lastInteractionType = 'duration';
                    departureTimeInput.value = '';
                }
                
                calculateAndDisplay();
            }

            function handleDurationBlur(event) {
                const input = event.target;
                const val = input.value.trim();
                if (val !== '') {
                    const num = parseInt(val, 10);
                    if (!isNaN(num)) {
                        input.value = String(num).padStart(2, '0');
                    } else {
                        input.value = '';
                    }
                }

                if (lastInteractionType === 'duration') {
                    const hoursVal = durationHoursInput.value.trim();
                    const minsVal = durationMinutesInput.value.trim();
                    if (hoursVal === '' && minsVal === '' && !departureTimeInput.value) {
                        handleInvalidInput('Bitte Abreise oder Dauer eingeben.');
                        return;
                    }
                }
                calculateAndDisplay();
            }

            function initializeUI() {
                currentTherme = thermeData[thermeSelect.value];

                const now = getNow();
                let nextOpen = currentTherme.permanentlyClosed ? null : findNextOpenDate(now);

                if (!nextOpen) {
                    nextOpen = {
                        date: now,
                        hours: { start: '09:00', end: '22:00' },
                        dayName: days[now.getDay()]
                    };
                }

                let defaultStartTime = nextOpen.hours.start;
                const [openHour, openMinute] = nextOpen.hours.start.split(':').map(Number);
                const openingTimeDate = new Date(nextOpen.date.getFullYear(), nextOpen.date.getMonth(), nextOpen.date.getDate(), openHour, openMinute, 0, 0);
                const closingTimeDate = getClosingTime(nextOpen.date, nextOpen.hours);

                if (nextOpen.date.toDateString() === now.toDateString() && !currentTherme.permanentlyClosed) {
                    if (now.getTime() >= closingTimeDate.getTime()) {
                        const tomorrow = new Date(now);
                        tomorrow.setDate(now.getDate() + 1);
                        const futureOpen = findNextOpenDate(tomorrow);
                        if (futureOpen) {
                            nextOpen = futureOpen;
                            defaultStartTime = futureOpen.hours.start;
                        }
                    } else if (now.getTime() > openingTimeDate.getTime()) {
                        defaultStartTime = getNowTimeFormatted();
                    }
                }
                
                currentCalculationDate = nextOpen.date;

                if (isEntryTimeAuto || !entryTimeInput.value) {
                    entryTimeInput.value = defaultStartTime;
                } else {
                    const [curH, curM] = entryTimeInput.value.split(':').map(Number);
                    const manualDate = new Date(nextOpen.date.getFullYear(), nextOpen.date.getMonth(), nextOpen.date.getDate(), curH, curM, 0, 0);
                    const targetClosing = getClosingTime(nextOpen.date, nextOpen.hours);
                    const [tOpenH, tOpenM] = nextOpen.hours.start.split(':').map(Number);
                    const targetOpening = new Date(nextOpen.date.getFullYear(), nextOpen.date.getMonth(), nextOpen.date.getDate(), tOpenH, tOpenM, 0, 0);

                    if (manualDate.getTime() < targetOpening.getTime()) {
                        entryTimeInput.value = nextOpen.hours.start;
                    } else if (manualDate.getTime() > targetClosing.getTime()) {
                        entryTimeInput.value = nextOpen.hours.end;
                    }
                }
                
                if (lastInteractionType === 'time') {
                    if (!departureTimeInput.value) {
                        departureTimeInput.value = '19:00';
                    }
                } else {
                    departureTimeInput.value = ''; 
                }

                displayOpeningHours(nextOpen.date);
                calculateAndDisplay();
            }

            function resetApp() {
                thermeSelect.selectedIndex = 0;
                entryTimeInput.value = '';
                departureTimeInput.value = '';
                durationHoursInput.value = '';
                durationMinutesInput.value = '';
                lastInteractionType = 'time';
                isEntryTimeAuto = true;
                initializeUI();
            }

            function openInfoModal() {
                const selectedTherme = thermeSelect.value;
                const thermeName = thermeSelect.options[thermeSelect.selectedIndex].text;
                const data = thermeData[selectedTherme];

                modalTitle.textContent = thermeName;
                const sortedDays = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

                let contentHtml = '<p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-1">Öffnungszeiten</p>';
                contentHtml += '<table class="w-full text-left border-collapse text-sm mb-3">';
                
                sortedDays.forEach(day => {
                    const hours = data.openingHoursData[day];
                    contentHtml += `<tr class="border-b border-slate-100">
                        <td class="py-1 text-slate-600 font-medium">${day}</td>
                        <td class="py-1 text-right font-semibold">${hours && !data.permanentlyClosed ? `<span class="text-slate-800">${hours.start} - ${hours.end} Uhr</span>` : '<span class="text-rose-500 font-bold text-xs bg-rose-50 px-2 py-0.5 rounded-full">Geschlossen</span>'}</td>
                    </tr>`;
                });
                
                contentHtml += '</table>';
                contentHtml += '<p class="text-xs font-bold tracking-wider text-slate-400 uppercase mb-1">Preise & Tarife</p>';
                contentHtml += '<table class="w-full text-left border-collapse text-sm">';
                data.ticketPrices.forEach(ticket => {
                    contentHtml += `<tr class="border-b border-slate-100"><td class="py-1 text-slate-600 font-medium">${ticket.name}</td><td class="py-1 text-right font-bold text-slate-800">${ticket.price.toFixed(2).replace('.', ',')} €</td></tr>`;
                });

                if (data.extensionCost && data.extensionCost > 0) {
                    contentHtml += `<tr class="border-b border-slate-100"><td class="py-1 text-slate-600 font-medium">Verlängerung 30 min.</td><td class="py-1 text-right font-bold text-slate-800">${data.extensionCost.toFixed(2).replace('.', ',')} €</td></tr>`;
                } else {
                    contentHtml += `<tr class="border-b border-slate-100"><td class="py-1 text-slate-600 font-medium">Verlängerung</td><td class="py-1 text-right font-semibold text-slate-500 text-xs">Nicht möglich (Folgetarif)</td></tr>`;
                }
                
                contentHtml += '</table>';

                modalContent.innerHTML = contentHtml;
                infoModal.classList.remove('hidden');
            }

            initializeUI();

            function startUpdateInterval() {
                setInterval(() => {
                    const now = getNow();
                    if (isEntryTimeAuto && currentCalculationDate.toDateString() === now.toDateString()) {
                        const todayHours = currentTherme.openingHoursData[days[now.getDay()]];
                        
                        if (todayHours && now.getTime() < getClosingTime(now, todayHours).getTime()) {
                            const [openH, openM] = todayHours.start.split(':').map(Number);
                            const openingTimeDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), openH, openM, 0, 0);
                            
                            if (now.getTime() >= openingTimeDate.getTime()) {
                                entryTimeInput.value = getNowTimeFormatted();
                                calculateAndDisplay();
                            }
                        }
                    }
                }, 10000);
            }

            startUpdateInterval();

            appTitle.addEventListener('click', resetApp);
            
            thermeSelect.addEventListener('change', () => {
                initializeUI();
            });

            autoTimeBtn.addEventListener('click', () => {
                isEntryTimeAuto = !isEntryTimeAuto;
                if (isEntryTimeAuto) {
                    initializeUI();
                } else {
                    updateAutoButtonUI();
                }
            });

            function setLiveTimeToNow() {
                const now = getNow();
                entryTimeInput.value = getNowTimeFormatted();
                currentCalculationDate = now;
                isEntryTimeAuto = true;
                lastInteractionType = 'time';
                calculateAndDisplay();
                updateAutoButtonUI();
            }

            setNowIconBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setLiveTimeToNow();
            });

            setDefaultDepartureBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                departureTimeInput.value = '19:00';
                durationHoursInput.value = '';
                durationMinutesInput.value = '';
                lastInteractionType = 'time';
                calculateAndDisplay();
            });

            entryTimeInput.addEventListener('input', handleInput);
            departureTimeInput.addEventListener('input', handleInput);
            durationHoursInput.addEventListener('input', handleInput);
            durationMinutesInput.addEventListener('input', handleInput);
            
            durationHoursInput.addEventListener('blur', handleDurationBlur);
            durationMinutesInput.addEventListener('blur', handleDurationBlur);
            
            infoButton.addEventListener('click', openInfoModal);
            closeModalButton.addEventListener('click', () => {
                infoModal.classList.add('hidden');
            });
            window.addEventListener('click', (event) => {
                if (event.target === infoModal) {
                    infoModal.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
