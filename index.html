<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Theme-Color für den Browserkopf -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* Grundlayout der eigentlichen App (Hell/Weiß) */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
        }

        /* 1. App-Inhalt: Startet unsichtbar und blendet weich ein */
        #app-content {
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #app-content.visible {
            opacity: 1;
        }

        /* 2. Start-Overlay: Tiefschwarzer Hintergrund (#000000) */
        #app-splash {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 1;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        #app-splash img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.1); /* Minimaler Lichtschein auf Schwarz */
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        /* Ausblend-Effekt: Overlay fadet aus und das Icon zoomt dezent */
        #app-splash.fade-out {
            opacity: 0;
        }

        #app-splash.fade-out img {
            transform: scale(1.08);
        }
    </style>
</head>
<body>

    <!-- Schwarzes Start-Overlay -->
    <div id="app-splash" aria-hidden="true">
        <img src="icon-192.png" alt="App Logo">
    </div>

    <!-- Hauptinhalt der App (Weißer Hintergrund) -->
    <div id="app-content">
        <main style="padding: 2.5rem 1.5rem; text-align: center;">
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">test App</h1>
            <p style="color: #64748b;">Die Anwendung ist bereit.</p>
        </main>
    </div>

    <script>
        // Anzeigedauer des schwarzen Splash-Screens in Millisekunden (1,2 Sekunden)
        const SPLASH_TIME = 1200;

        window.addEventListener('load', () => {
            const splash = document.getElementById('app-splash');
            const content = document.getElementById('app-content');

            setTimeout(() => {
                // Weißen App-Inhalt einblenden
                if (content) content.classList.add('visible');

                // Schwarzes Overlay ausblenden und entfernen
                if (splash) {
                    splash.classList.add('fade-out');
                    setTimeout(() => {
                        splash.remove();
                    }, 600);
                }
            }, SPLASH_TIME);
        });
    </script>

</body>
</html>
