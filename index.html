<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* 
         * Start-Overlay für Desktop und Mobile:
         * Weißer Hintergrund, perfekt zentriert, kein Versatz.
         */
        #app-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            opacity: 1;
            /* Sanftes, langes Ausblenden */
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: all;
        }

        #app-splash img {
            /* 96px entspricht dem Standard-Splash-Maß von Android PWAs */
            width: 96px;
            height: 96px;
            object-fit: contain;
            border-radius: 20px;
            /* Kein Sprung durch CSS-Animationen */
            transform: translateZ(0);
        }
    </style>
</head>
<body>

    <!-- Start-Overlay -->
    <div id="app-splash" aria-hidden="true">
        <img src="icon-192.png" alt="App Logo">
    </div>

    <!-- Hauptinhalt deiner App -->
    <main style="padding: 2rem; text-align: center;">
        <h1>test App</h1>
        <p>Die Anwendung ist geladen.</p>
    </main>

    <script>
        // Dauer der Anzeige in Millisekunden (1500 ms = 1,5 Sekunden)
        const SPLASH_DURATION = 1500; 

        window.addEventListener('load', () => {
            const splash = document.getElementById('app-splash');
            if (splash) {
                setTimeout(() => {
                    splash.style.opacity = '0';
                    // Nach Ende der CSS-Transition komplett aus dem DOM entfernen
                    setTimeout(() => {
                        splash.remove();
                    }, 600);
                }, SPLASH_DURATION);
            }
        });
    </script>

</body>
</html>
